plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.fandex'
version = '0.1.0'

android {
  namespace "org.fandex.upnext"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  // The tick runs the app's JavaScript as a headless task, which is React
  // Native's API and not Expo's. The version comes from the app's build.
  implementation "com.facebook.react:react-android"
}
