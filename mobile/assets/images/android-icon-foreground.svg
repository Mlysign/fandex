<!-- Source of android-icon-foreground.png (the Android adaptive icon's foreground).
     Same mark as public/icon.svg, on a transparent background, scaled 7.5 instead of 11
     so its corners sit inside the 66dp safe circle of the 108dp canvas that every
     launcher mask keeps. The background colour comes from app.json. -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(256,256) scale(7.5) translate(-11.8,-14.1)">
    <rect x="0" y="5" width="18" height="20" rx="4" fill="#a78bfa" transform="rotate(-9 9 15)"/>
    <rect x="7" y="2" width="18" height="20" rx="4" fill="#C8A24B" stroke="#100E0C" stroke-width="1"/>
  </g>
</svg>
