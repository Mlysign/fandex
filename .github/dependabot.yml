# S10: automated dependency updates. Dependabot opens PRs for npm and GitHub
# Actions bumps; CI (ci.yml) gates each one on typecheck, lint, test and audit.
# The root holds dev tooling only since the old site was removed (2026-10-23).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # Weekly since 2026-11-05. Daily (from 2026-07-22) meant an email burst
      # most days across three folders. The cost of weekly: a fresh HIGH
      # advisory can fail the `audit` job on unrelated pushes until the next
      # run, as the eslint-chain advisories (20595b4) and sharp/libvips
      # (a3aff34) did. Dependabot security updates (repo Settings → Code
      # security) are the same-day answer to that. Neither helps when the fix
      # is an override rather than a bump: see "overrides" in package.json.
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk minor/patch bumps into one PR to cut noise; majors stay
      # individual so breaking changes get reviewed on their own.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major bumps CI red-flagged as toolchain-incompatible — pin to the current
      # major so Dependabot stops re-proposing them. Minor/patch within the major
      # still flow. Remove an entry to revisit once the ecosystem catches up.
      # - ESLint 10: the lint plugins peer-depend on ESLint 9.
      # - TypeScript 7 is the new native compiler; too early for eslint/vitest.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The Worker and the app are their own packages with their own lockfiles, and
  # CI audits each (ci.yml), so each gets its own updates. Same cadence and
  # grouping as the root.
  - package-ecosystem: npm
    directory: "/worker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/mobile"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Expo pins these per SDK, down to the patch, and they move only with
      # `npx expo install --fix` or an SDK upgrade. Any bump Dependabot offers
      # is one --fix undoes: PR #40 took React Native 0.86 to 0.88 and its
      # lockfile did not install, #51 offered @expo/ui 58 on SDK 57, and #62
      # re-offered the nine versions --fix had just rolled back from #57, with
      # CI green each time (CI never runs `expo install --check`).
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
