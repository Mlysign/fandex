# The website, rebuilt and published: fandex.org is files a build writes
# (docs/website.md), so a title added to the catalog has no static page, and
# the catalog files are as old as the last publish, until something runs
# `node mobile/web/publish.mjs`. This runs it, by hand only (Actions → Website
# → Run workflow).
#
# ⚠️ Since 2026-10-16 the NIGHTLY rebuild runs on Nils's PC instead
# (mobile/web/nightly.mjs, the Windows task "Fandex nightly site"), with
# Wrangler's browser login, so it needs no token. The timer that was here
# never published: the token below was never made. Putting a schedule back
# without retiring the PC task would publish twice a day.
#
# Needs, as repository secrets:
#   CLOUDFLARE_API_TOKEN    a token with "Workers Scripts: Edit" on the account.
#                           Only Nils can make it. Until it exists every run
#                           stops at the first step, green, and says so.
#   CLOUDFLARE_ACCOUNT_ID   so wrangler does not have to ask which account.
#   EXPO_PUBLIC_TMDB_API_KEY, EXPO_PUBLIC_TRAKT_CLIENT_ID,
#   EXPO_PUBLIC_GOOGLE_CLIENT_ID
#                           what mobile/.env holds on Nils's machine. All three
#                           are public by construction (they are in the web
#                           bundle), and kept as secrets only so one place says
#                           where they come from. ⚠️ When the TMDB key is
#                           rotated, this secret is one more place to update.
#
# publish.mjs refuses a short or half-built site on its own (docs/website.md,
# "Rules specific to the website"); a failed run leaves the site as it was.

name: Website

on:
  workflow_dispatch:

permissions:
  contents: read

# Two publishes at once would race on the same Worker.
concurrency:
  group: website-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish fandex.org
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Cloudflare token reaches the publish step only, never the installs
    # (whose package scripts would otherwise see it). This step is told only
    # whether it exists.
    steps:
      - name: Is there a Cloudflare token?
        id: token
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN secret yet, so nothing is published. See the comment at the top of this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.token.outputs.ready == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            worker/package-lock.json

      # The renderer compiles shared modules from src/ (root packages), the app
      # export needs mobile/, and esbuild and wrangler come from worker/.
      - name: Install
        if: steps.token.outputs.ready == 'true'
        run: |
          npm ci
          npm ci --prefix mobile
          npm ci --prefix worker

      - name: Write mobile/.env
        if: steps.token.outputs.ready == 'true'
        env:
          TMDB: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}
          TRAKT: ${{ secrets.EXPO_PUBLIC_TRAKT_CLIENT_ID }}
          GOOGLE: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
          SUPPORT: ${{ secrets.EXPO_PUBLIC_SUPPORT_URL }}
        run: |
          {
            echo "EXPO_PUBLIC_TMDB_API_KEY=$TMDB"
            echo "EXPO_PUBLIC_TRAKT_CLIENT_ID=$TRAKT"
            if [ -n "$GOOGLE" ]; then echo "EXPO_PUBLIC_GOOGLE_CLIENT_ID=$GOOGLE"; fi
            if [ -n "$SUPPORT" ]; then echo "EXPO_PUBLIC_SUPPORT_URL=$SUPPORT"; fi
          } > mobile/.env

      # Each title the build fetched, kept between runs: a build asks the API
      # again only for titles whose updatedAt moved (build.mjs, step 3).
      - name: Titles from the last build
        if: steps.token.outputs.ready == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: mobile/web/dist/cache
          key: site-items-${{ github.run_id }}
          restore-keys: site-items-

      - name: Build and publish
        if: steps.token.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node mobile/web/publish.mjs
