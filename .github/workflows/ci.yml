name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read the code and nothing else. A job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  verify:
    # The shared modules in src/lib (the Worker and the app import them), their
    # tests, and lint for all three packages (eslint.config.mjs).
    name: Shared lib · Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Doc-size guard (informational only, never fails the build)
        # TASKS.md was archived from 441 -> 77 lines on 2026-07-18 specifically to
        # keep planning cheap (see docs/archive/history.md + AGENTS.md doc map).
        # This just nudges a future session to archive a finished phase again
        # rather than letting the file silently re-bloat back to its old size.
        run: |
          LINES=$(wc -l < TASKS.md)
          echo "TASKS.md is $LINES lines"
          if [ "$LINES" -gt 200 ]; then
            echo "::warning file=TASKS.md::TASKS.md is $LINES lines (>200) — consider archiving finished phases into docs/archive/history.md, per AGENTS.md's doc-map convention."
          fi
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  worker:
    # The Cloudflare Worker (worker/), its own package. It compiles shared
    # modules from ../src, so a change there can break it without
    # touching worker/ at all, which is why this runs on every push and not only
    # on changes under worker/.
    #
    name: Worker · Typecheck · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # worker-configuration.d.ts is generated, not committed.
      - name: Generate runtime types
        run: npx wrangler types
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        # Runs inside workerd against a local D1: the same SQLite build as prod.
        run: npm test
      - name: Bundle (dry run)
        # The bundle is what refuses a Node-only module the Worker reached
        # through ../src (AGENTS.md); tsc does not. A dry run builds without
        # deploying and needs no Cloudflare login or secret.
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-bundle"

  app:
    # The Expo app (mobile/), its own package. Typecheck and the logic tests
    # only: nothing here builds an APK. Like the Worker it compiles site
    # modules from ../src, so it runs on every push.
    #
    name: App · Typecheck · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test

  audit:
    # One run per package: the root (dev tooling only since the old site went,
    # 2026-10-23), the Worker and the app each have their own lockfile, and the
    # last two are what ships. Not fail-fast, so one red audit does not hide another.
    name: npm audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [".", worker, mobile]
        include:
          - level: high
          # The app's high advisories (2026-10-23: node-forge, xcode, uuid) all
          # come through Expo's build CLI (@expo/cli), a runtime dependency on
          # paper that never reaches the bundle, and npm's only fix is a breaking
          # Expo downgrade. A critical one still fails the job.
          - package: mobile
            level: critical
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # npm audit reads the lockfile, so nothing is installed and no install
      # script runs. --omit=dev: build and test tooling never ships, and what
      # ships is what this job is for.
      - name: Audit (runtime deps)
        run: npm audit --audit-level=${{ matrix.level }} --omit=dev
