<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #0B0A08; }
    a { color: #C8A24B; } a:hover { color: #D4B063; }
    * { box-sizing: border-box; }
    .eyebrow { font-family: 'Space Mono', ui-monospace, monospace; font-size: 9px; line-height: 1; letter-spacing: 0.13em; text-transform: uppercase; color: #9A8F80; }
    .meta { font-family: 'Space Mono', ui-monospace, monospace; font-size: 10px; line-height: 1.4; color: #9A8F80; }
    .label { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 11px; line-height: 1; font-weight: 600; }
  </style>
</helmet>

<div style="width: 375px; height: 812px; position: relative; overflow: hidden; background: #100E0C; font-family: 'Space Grotesk', system-ui, sans-serif;">

  <div style="position: absolute; inset: 0; background: #100E0C;">
    <div style="padding: 14px 24px 0; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; gap: 8px; align-items: center;">
        <div style="width: 40px; height: 40px; border-radius: 999px; background: rgb(200 162 75 / 0.14); border: 1px solid rgb(200 162 75 / 0.4);"></div>
        <div style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgb(237 231 220 / 0.14);"></div>
        <div style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgb(237 231 220 / 0.14);"></div>
        <div style="flex-grow: 1;"></div>
        <div style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid #C8A24B; background: rgb(200 162 75 / 0.14);"></div>
      </div>
      <div style="height: 38px; border-radius: 12px; border: 1px solid rgb(237 231 220 / 0.14); background: #181512;"></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 16px 24px;">
      <div style="height: 220px; border-radius: 10px; background: #181512; border: 1px solid rgb(237 231 220 / 0.09);"></div>
      <div style="height: 220px; border-radius: 10px; background: #181512; border: 1px solid rgb(237 231 220 / 0.09);"></div>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: rgb(11 10 8 / 0.66);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #201C18; border-top: 1px solid rgb(237 231 220 / 0.09); border-radius: 16px 16px 0 0; box-shadow: 0 -12px 40px -8px rgb(0 0 0 / 0.55); display: flex; flex-direction: column;">

    <div style="display: flex; justify-content: center; padding: 8px 0 6px;">
      <div style="width: 36px; height: 4px; border-radius: 999px; background: rgb(237 231 220 / 0.18);"></div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 4px 20px 14px; border-bottom: 1px solid rgb(237 231 220 / 0.09);">
      <span style="font-family: 'DM Serif Display', Georgia, serif; font-size: 21px; line-height: 1.1; color: #EDE7DC;">Filters</span>
      <span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 10px; color: #100E0C; background: #C8A24B; border-radius: 999px; padding: 3px 7px; line-height: 1;">3</span>
      <div style="flex-grow: 1;"></div>
      <button style="min-height: 44px; padding: 0 10px; background: none; border: 0; color: #C8A24B; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 11px; font-weight: 600; cursor: pointer;">Reset all</button>
      <button aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A8F80" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- accordion rows -->
    <div style="display: flex; flex-direction: column;">

      <!-- collapsed row -->
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 20px; border-bottom: 1px solid rgb(237 231 220 / 0.09);">
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1;">
          <span class="eyebrow">Must include</span>
          <span style="font-size: 12px; color: #C8A24B; font-weight: 600;">sci-fi · Denis Villeneuve</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F665A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 20px; border-bottom: 1px solid rgb(237 231 220 / 0.09);">
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1;">
          <span class="eyebrow">Must exclude</span>
          <span style="font-size: 12px; color: #6F665A;">Nothing excluded</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F665A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>

      <!-- EXPANDED row: Available on -->
      <div style="border-bottom: 1px solid rgb(237 231 220 / 0.09); background: #181512;">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 20px;">
          <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1;">
            <span class="eyebrow" style="color: #C8A24B;">Available on</span>
            <span style="font-size: 12px; color: #EDE7DC; font-weight: 600;">Netflix, Apple TV+, Steam</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C8A24B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
        </div>

        <div style="display: flex; gap: 6px; padding: 0 20px 12px;">
          <span class="label" style="padding: 8px 14px; border-radius: 999px; background: rgb(200 162 75 / 0.14); color: #C8A24B;">Movies &amp; shows</span>
          <span class="label" style="padding: 8px 14px; border-radius: 999px; color: #9A8F80;">Games</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 20px 16px;">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 44px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="#EDE7DC"><path d="M5 2h4l6 12V2h4v20h-4L9 10v12H5z"/></svg>
            <span style="font-size: 12px; color: #EDE7DC; flex-grow: 1;">Netflix</span>
            <span class="meta">41</span>
            <div style="width: 20px; height: 20px; border-radius: 6px; background: #C8A24B; display: flex; align-items: center; justify-content: center;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#100E0C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; min-height: 44px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="#9A8F80"><path d="M3 4h5l4 7 4-7h5l-6.5 10L21 24h-5l-4-7-4 7H3l6.5-10z"/></svg>
            <span style="font-size: 12px; color: #EDE7DC; flex-grow: 1;">HBO Max</span>
            <span class="meta">18</span>
            <div style="width: 20px; height: 20px; border-radius: 6px; border: 1px solid rgb(237 231 220 / 0.14);"></div>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; min-height: 44px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="#EDE7DC"><path d="M16.2 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.9c-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .7 1.1 1.6 2.3 2.8 2.2 1.1 0 1.5-.7 2.9-.7s1.7.7 2.9.7 2-1.1 2.7-2.2c.9-1.2 1.2-2.4 1.2-2.5 0 0-2.3-.9-2.3-3.5z"/><path d="M14 5.4c.6-.8 1-1.8.9-2.9-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.7-.9 2.8 1 0 2-.5 2.6-1.3z"/></svg>
            <span style="font-size: 12px; color: #EDE7DC; flex-grow: 1;">Apple TV+</span>
            <span class="meta">9</span>
            <div style="width: 20px; height: 20px; border-radius: 6px; background: #C8A24B; display: flex; align-items: center; justify-content: center;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#100E0C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; min-height: 44px;">
            <span style="font-size: 12px; color: #C8A24B; font-weight: 600;">Show 7 more</span>
          </div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 20px; border-bottom: 1px solid rgb(237 231 220 / 0.09);">
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1;">
          <span class="eyebrow">Your lists</span>
          <span style="font-size: 12px; color: #C8A24B; font-weight: 600;">Library hidden</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F665A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 20px;">
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1;">
          <span class="eyebrow">Release year</span>
          <span style="font-size: 12px; color: #6F665A;">Any year</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F665A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </div>

    <div style="padding: 12px 20px 22px; border-top: 1px solid rgb(237 231 220 / 0.09);">
      <div style="height: 48px; border-radius: 999px; background: #C8A24B; color: #100E0C; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600;">Show 134 titles</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
