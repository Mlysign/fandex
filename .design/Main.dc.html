<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #0B0A08; }
    a { color: #C8A24B; } a:hover { color: #D4B063; }
    * { box-sizing: border-box; }
    .eyebrow { font-family: 'Space Mono', ui-monospace, monospace; font-size: 9px; line-height: 1; letter-spacing: 0.13em; text-transform: uppercase; color: #9A8F80; }
    .meta { font-family: 'Space Mono', ui-monospace, monospace; font-size: 10px; line-height: 1.4; color: #9A8F80; }
    .label { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 11px; line-height: 1; font-weight: 600; }
    .seg { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 15px; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 11px; font-weight: 600; }
    .pchip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 13px; border-radius: 999px; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 11px; font-weight: 600; }
  </style>
</helmet>

<div style="width: 375px; height: 812px; position: relative; overflow: hidden; background: #100E0C; font-family: 'Space Grotesk', system-ui, sans-serif;">

  <div style="position: absolute; inset: 0; background: #100E0C;">
    <div style="padding: 14px 24px 0; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; gap: 8px; align-items: center;">
        <div style="width: 40px; height: 40px; border-radius: 999px; background: rgb(200 162 75 / 0.14); border: 1px solid #C8A24B;"></div>
        <div style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgb(237 231 220 / 0.14);"></div>
        <div style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgb(237 231 220 / 0.14);"></div>
        <div style="flex-grow: 1;"></div>
        <div style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid #C8A24B; background: rgb(200 162 75 / 0.14);"></div>
      </div>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: rgb(11 10 8 / 0.66);"></div>

  <!-- sheet: 744px, top edge at 68 -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 744px; background: #201C18; border-top: 1px solid rgb(237 231 220 / 0.09); border-radius: 16px 16px 0 0; box-shadow: 0 -12px 40px -8px rgb(0 0 0 / 0.55); display: flex; flex-direction: column;">

    <div style="display: flex; justify-content: center; padding: 8px 0 6px;">
      <div style="width: 36px; height: 4px; border-radius: 999px; background: rgb(237 231 220 / 0.18);"></div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 4px 20px 14px; border-bottom: 1px solid rgb(237 231 220 / 0.09);">
      <span style="font-family: 'DM Serif Display', Georgia, serif; font-size: 21px; line-height: 1.1; color: #EDE7DC;">Filters</span>
      <span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 10px; color: #100E0C; background: #C8A24B; border-radius: 999px; padding: 3px 7px; line-height: 1;">3</span>
      <div style="flex-grow: 1;"></div>
      <button style="min-height: 44px; padding: 0 10px; background: none; border: 0; color: #C8A24B; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 11px; font-weight: 600; cursor: pointer;">Reset all</button>
      <button aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A8F80" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div style="flex-grow: 1; overflow: hidden; position: relative;">
      <div style="display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 8px;">

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span class="eyebrow">Must include</span>
          <div style="min-height: 44px; border-radius: 12px; border: 1px solid #C8A24B; background: #181512; display: flex; align-items: center; padding: 0 12px;">
            <span style="font-size: 12px; color: #6F665A;">tag, person, studio…</span>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
            <span style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 999px; background: rgb(200 162 75 / 0.14); color: #C8A24B; font-size: 11px; font-weight: 600;">sci-fi
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </span>
            <span style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 999px; background: rgb(200 162 75 / 0.14); color: #C8A24B; font-size: 11px; font-weight: 600;">Denis Villeneuve
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </span>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span class="eyebrow">Must exclude</span>
          <div style="min-height: 44px; border-radius: 12px; border: 1px solid #E5674C; background: #181512; display: flex; align-items: center; padding: 0 12px;">
            <span style="font-size: 12px; color: #6F665A;">tag, person, studio…</span>
          </div>
        </div>

        <div style="height: 1px; background: rgb(237 231 220 / 0.09);"></div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span class="eyebrow">Release year</span>
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="flex-grow: 1; min-height: 44px; border-radius: 12px; border: 1px solid rgb(237 231 220 / 0.14); background: #181512; display: flex; flex-direction: column; justify-content: center; padding: 0 12px;">
              <span class="meta" style="font-size: 9px; color: #6F665A;">FROM</span>
              <span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 13px; color: #EDE7DC; font-variant-numeric: tabular-nums;">1950</span>
            </div>
            <span style="color: #6F665A;">–</span>
            <div style="flex-grow: 1; min-height: 44px; border-radius: 12px; border: 1px solid rgb(237 231 220 / 0.14); background: #181512; display: flex; flex-direction: column; justify-content: center; padding: 0 12px;">
              <span class="meta" style="font-size: 9px; color: #6F665A;">TO</span>
              <span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 13px; color: #EDE7DC; font-variant-numeric: tabular-nums;">2027+</span>
            </div>
          </div>
        </div>

        <div style="height: 1px; background: rgb(237 231 220 / 0.09);"></div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; align-items: baseline; gap: 8px;">
            <span class="eyebrow">Available on</span>
            <span class="meta" style="font-size: 9px;">· Germany</span>
          </div>

          <span class="meta" style="color: #6F665A;">Movies &amp; shows</span>
          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
            <span class="pchip" style="background: rgb(200 162 75 / 0.14); border: 1px solid #C8A24B; color: #EDE7DC;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="#EDE7DC"><path d="M5 2h4l6 12V2h4v20h-4L9 10v12H5z"/></svg>Netflix</span>
            <span class="pchip" style="border: 1px solid rgb(237 231 220 / 0.14); color: #9A8F80;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="#9A8F80"><path d="M3 4h5l4 7 4-7h5l-6.5 10L21 24h-5l-4-7-4 7H3l6.5-10z"/></svg>HBO Max</span>
            <span class="pchip" style="background: rgb(200 162 75 / 0.14); border: 1px solid #C8A24B; color: #EDE7DC;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="#EDE7DC"><path d="M16.2 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.9c-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .7 1.1 1.6 2.3 2.8 2.2 1.1 0 1.5-.7 2.9-.7s1.7.7 2.9.7 2-1.1 2.7-2.2c.9-1.2 1.2-2.4 1.2-2.5 0 0-2.3-.9-2.3-3.5z"/><path d="M14 5.4c.6-.8 1-1.8.9-2.9-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.7-.9 2.8 1 0 2-.5 2.6-1.3z"/></svg>Apple TV+</span>
            <span class="pchip" style="border: 1px dashed rgb(237 231 220 / 0.14); color: #C8A24B;">+7 more</span>
          </div>

          <span class="meta" style="color: #6F665A;">Games</span>
          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
            <span class="pchip" style="background: rgb(200 162 75 / 0.14); border: 1px solid #C8A24B; color: #EDE7DC;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="#EDE7DC"><circle cx="12" cy="12" r="10" opacity=".35"/><circle cx="15" cy="9" r="3.4"/><path d="M2.5 15.5l5.5 2.2a3 3 0 1 0 .8-2.6z"/></svg>Steam</span>
            <span class="pchip" style="border: 1px solid rgb(237 231 220 / 0.14); color: #9A8F80;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="#9A8F80"><rect x="2" y="3" width="8.4" height="18" rx="4.2"/><rect x="13.6" y="3" width="8.4" height="18" rx="4.2" opacity=".5"/></svg>Switch</span>
            <span class="pchip" style="border: 1px solid rgb(237 231 220 / 0.14); color: #9A8F80;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="#9A8F80"><circle cx="12" cy="12" r="10" opacity=".3"/><path d="M12 2c2 0 3.6.8 3.6 1.6 0 1.4-6 6.6-8.8 12.5C5.2 14.5 4 12.5 4 10 4 5.6 7.6 2 12 2z"/><path d="M20 10c0 2.5-1.2 4.5-2.8 6.1C14.4 10.2 8.4 5 8.4 3.6 8.4 2.8 10 2 12 2c4.4 0 8 3.6 8 8z" opacity=".5"/></svg>Xbox</span>
          </div>
        </div>

        <div style="height: 1px; background: rgb(237 231 220 / 0.09);"></div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <span class="eyebrow" style="margin-bottom: 4px;">Your lists</span>
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <span style="font-size: 12px; color: #EDE7DC;">In library</span>
            <div style="display: flex; border-radius: 12px; border: 1px solid rgb(237 231 220 / 0.14); overflow: hidden;">
              <span class="seg" style="color: #9A8F80;">Any</span>
              <span class="seg" style="color: #9A8F80;">Only</span>
              <span class="seg" style="background: rgb(200 162 75 / 0.14); color: #C8A24B;">Hide</span>
            </div>
          </div>
        </div>

      </div>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: linear-gradient(to bottom, rgb(32 28 24 / 0), #201C18);"></div>
    </div>

    <div style="padding: 12px 20px 22px; border-top: 1px solid rgb(237 231 220 / 0.09); background: #201C18;">
      <div style="height: 48px; border-radius: 999px; background: #C8A24B; color: #100E0C; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600;">Show 134 titles</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
